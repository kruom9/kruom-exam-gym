:root{--blue:#3189D0;--blue-d:#1465A5;--blue-l:#EAF6FE;--org:#FF8A1F;--org2:#FFB547;--ink:#1d2b3a;--mut:#6b7a8c;--line:#e3ecf5;--r:22px;--sh:0 6px 22px rgba(20,101,165,.10),0 1px 3px rgba(20,101,165,.08);
--l0:#3189D0;--l0b:#e3f1fc;--l1:#22a55b;--l1b:#def7e7;--l2:#f08a12;--l2b:#fff0dc;--l3:#e5484d;--l3b:#ffe8e8;}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Sarabun","TH Sarabun New","Noto Sans Thai","Leelawadee UI",Tahoma,system-ui,sans-serif;color:var(--ink);font-size:16px;line-height:1.55;
background:#fff linear-gradient(180deg,#e9f5fe 0,#f6fbff 260px,#fff 520px) no-repeat;min-height:100vh}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font-family:inherit;font-size:16px}
.sim{position:sticky;top:0;z-index:60;background:repeating-linear-gradient(45deg,#fff1f1,#fff1f1 10px,#ffe2e2 10px,#ffe2e2 20px);color:#b42318;
font-weight:700;text-align:center;font-size:13.5px;padding:5px 10px;border-bottom:1px solid #ffc9c9}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 120px}
body.wide .wrap{max-width:1180px}
.topbar{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.topbar h1{font-size:19px;margin:0;flex:1;line-height:1.3}
.iconbtn{width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:var(--sh);display:inline-flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin:0 0 14px}
.card.blue{background:var(--blue-l);box-shadow:none}
.card.org{background:linear-gradient(135deg,#ff9a2e 0%,#ffb547 100%);color:#fff}
.card h2{font-size:18px;margin:0 0 8px}
.card h3{font-size:16px;margin:0 0 6px}
.mut{color:var(--mut)}.small{font-size:13.5px}.tiny{font-size:12px}
.row{display:flex;gap:10px;align-items:center}.row.wrapx{flex-wrap:wrap}.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:0 22px;border-radius:999px;font-weight:700;font-size:16.5px;background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(49,137,208,.3);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.block{display:flex;width:100%}
.btn.ghost{background:#fff;color:var(--blue-d);box-shadow:inset 0 0 0 2px #cfe5f7}
.btn.light{background:var(--blue-l);color:var(--blue-d);box-shadow:none}
.btn.white{background:#fff;color:#e8730c;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.btn.green{background:#22a55b;box-shadow:0 4px 12px rgba(34,165,91,.3)}
.btn.red{background:#e5484d}
.btn.sm{min-height:40px;padding:0 16px;font-size:14.5px}
.btn[disabled]{background:#c9d6e2;color:#fff;box-shadow:none;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.lv0{background:var(--l0b);color:var(--l0)}.lv1{background:var(--l1b);color:var(--l1)}.lv2{background:var(--l2b);color:var(--l2)}.lv3{background:var(--l3b);color:var(--l3)}
.b0{background:#eef1f4;color:#7b8794}.b1{background:#ffe8e8;color:#d93036}.b2{background:#fff4d6;color:#b77900}.b3{background:#def7e7;color:#178a49}
.bar{height:10px;background:#e6eef6;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);border-radius:99px}
.bar.org>i{background:linear-gradient(90deg,#ff8a1f,#ffb547)}.bar.w{background:rgba(255,255,255,.35)}.bar.w>i{background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--blue-l);border-radius:16px;padding:10px;text-align:center}
.tile b{display:block;font-size:20px}
/* select screen */
.hero{text-align:center;padding:10px 0 4px}
.hero h1{font-size:24px;margin:6px 0 0;color:var(--blue-d)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 18px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 2px #d6e7f5;font-weight:700;color:var(--blue-d)}
.chip.on{background:var(--blue);color:#fff;box-shadow:none}
.stu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:52vh;overflow:auto;padding:4px}
.stu button{background:#fff;border-radius:16px;box-shadow:var(--sh);padding:10px;text-align:left;min-height:56px;font-size:14.5px}
.stu button b{display:block;color:var(--blue-d)}
/* roadmap */
.unit{position:relative;display:flex;gap:14px;align-items:center;background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;margin:0 0 14px 34px}
.unit:before{content:"";position:absolute;left:-22px;top:-14px;bottom:-14px;width:4px;background:#d6e7f5}
.unit:first-child:before{top:50%}.unit:last-child:before{bottom:50%}
.unit .dot{position:absolute;left:-33px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:#fff;border:4px solid var(--blue);font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--blue-d)}
.unit.lock{background:#f4f7fa;box-shadow:none;color:#98a6b5}.unit.lock .dot{border-color:#c5d2de}
.unit.done .dot{background:var(--blue);color:#fff}
.stars{color:#ffb547;letter-spacing:1px;font-size:15px}.stars .off{color:#d7e1ea}
.chap{display:flex;gap:12px;align-items:center;cursor:pointer}
.chapno{width:52px;height:52px;border-radius:16px;background:var(--blue-l);color:var(--blue-d);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
/* quiz */
.qhead{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
.qcard{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:12px}
.qtext{font-size:18.5px;font-weight:700;line-height:1.6;margin:10px 0 4px}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;border-radius:18px;box-shadow:inset 0 0 0 2px #dbe8f3;padding:14px 16px;margin:0 0 10px;min-height:56px;font-size:16.5px;line-height:1.5}
.choice .k{flex:none;width:30px;height:30px;border-radius:50%;background:var(--blue-l);color:var(--blue-d);font-weight:700;display:flex;align-items:center;justify-content:center}
.choice.sel{box-shadow:inset 0 0 0 3px var(--blue);background:#f3f9ff}.choice.sel .k{background:var(--blue);color:#fff}
.choice.ok{box-shadow:inset 0 0 0 3px #22a55b;background:#effbf3}.choice.ok .k{background:#22a55b;color:#fff}
.choice.bad{box-shadow:inset 0 0 0 3px #e5484d;background:#fff3f3}.choice.bad .k{background:#e5484d;color:#fff}
.choice[disabled]{cursor:default}
.unsure{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 2px #e4d7c2;color:#9a6a12;font-weight:700}
.unsure.on{background:#fff4d6;box-shadow:inset 0 0 0 2px #f2a516}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);box-shadow:0 -4px 18px rgba(20,101,165,.10);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.actionbar .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.fb{border-radius:18px;padding:14px 16px;margin:4px 0 12px;font-weight:700}
.fb.ok{background:#def7e7;color:#178a49}.fb.bad{background:#ffe8e8;color:#c22a2f}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(14,33,54,.42);z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto;animation:up .2s ease-out}
.sheet.center{border-radius:26px;margin:auto;max-width:720px;max-height:90vh}
.scrim.mid{align-items:center;padding:16px}
.grab{width:46px;height:5px;border-radius:9px;background:#d5dee7;margin:2px auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0}
.steps li{position:relative;padding:8px 0 8px 40px}
.steps li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:8px;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.chat{display:flex;flex-direction:column;gap:10px}
.bub{max-width:88%;padding:12px 14px;border-radius:18px;line-height:1.55}
.bub.ai{background:var(--blue-l);border-top-left-radius:6px;align-self:flex-start}
.bub.me{background:var(--blue);color:#fff;border-top-right-radius:6px;align-self:flex-end}
.qbtns{display:flex;gap:8px;flex-wrap:wrap}
.qbtns button{background:#fff;box-shadow:inset 0 0 0 2px #cfe5f7;color:var(--blue-d);border-radius:999px;min-height:40px;padding:0 14px;font-weight:700;font-size:14.5px}
/* mastery card */
.mcard{background:linear-gradient(160deg,#ff9a2e,#ffb85a);border-radius:26px;color:#fff;padding:18px;box-shadow:0 10px 26px rgba(255,138,31,.32);margin-bottom:14px}
.gauge{position:relative;width:240px;height:140px;margin:6px auto 0}
.gauge .val{position:absolute;left:0;right:0;bottom:6px;text-align:center}
.gauge .val b{font-size:40px;line-height:1}
.mtiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.mtiles div{background:rgba(255,255,255,.22);border-radius:14px;padding:8px 4px;text-align:center;font-size:12.5px}
.mtiles b{display:block;font-size:17px}
.nexttag{display:inline-block;background:#fff;color:#e8730c;border-radius:999px;padding:4px 14px;font-weight:700;font-size:14px}
/* test */
.room{border-radius:var(--r);padding:16px;margin-bottom:14px;background:linear-gradient(135deg,#ff9a2e,#ffb547);color:#fff;box-shadow:0 8px 20px rgba(255,138,31,.25)}
.room.lock{background:#f1f4f8;color:#7d8b99;box-shadow:none}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;background:#fff4e6;color:#e8730c;border-radius:999px;padding:4px 14px}
.timer.warn{background:#ffe8e8;color:#d93036}
.qnav{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.qnav button{height:36px;border-radius:10px;background:#f0f5fa;font-weight:700;font-size:13.5px}
.qnav button.a{background:var(--blue-l);color:var(--blue-d);box-shadow:inset 0 0 0 2px #9ccbf0}
.qnav button.cur{background:var(--blue);color:#fff}
.big{font-size:64px;font-weight:700;line-height:1}
.badge{display:inline-block;padding:6px 18px;border-radius:999px;font-weight:700;font-size:18px}
.badge.pass{background:#def7e7;color:#178a49}.badge.fail{background:#ffe8e8;color:#c22a2f}
/* teacher */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border-radius:20px;box-shadow:var(--sh);padding:14px 16px}
.kpi b{display:block;font-size:26px;color:var(--blue-d)}
.dgrid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){.dgrid{grid-template-columns:1.25fr 1fr}}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 8px;text-align:left;font-size:14px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:700;font-size:13px;white-space:nowrap}
th.s{cursor:pointer}th.s:hover{color:var(--blue-d)}
.heat td.h{text-align:center;font-weight:700;border-radius:8px;border:2px solid #fff;min-width:56px}
.scroll{overflow:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.tabs button{min-height:42px;padding:0 16px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 2px #d6e7f5;font-weight:700;color:var(--blue-d)}
.tabs button.on{background:var(--blue);color:#fff;box-shadow:none}
.trow{cursor:pointer}.trow:hover{background:#f5faff}
.hbar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:14px}.hbar .lab{width:46%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hbar .bar{flex:1}
.note{background:#fff8e6;border-radius:16px;padding:10px 14px;color:#8a5a00;font-size:14px;margin:8px 0}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:99;background:#1d2b3a;color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:up .25s}
.footer{text-align:center;color:var(--mut);font-size:12.5px;margin-top:20px}
.egg{display:block;margin:0 auto}
details summary{cursor:pointer;font-weight:700;color:var(--blue-d)}
code,pre{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:#f3f7fb;border-radius:8px}
pre{padding:10px;white-space:pre-wrap;word-break:break-word}

</style>

const SUBJ=CURRICULUM.subject, BOOK=SUBJ.books[0], CHAPTERS=BOOK.chapters;
const TOPICS=[];CHAPTERS.forEach(c=>c.topics.forEach((t,i)=>TOPICS.push(Object.assign({},t,{chapterId:c.id,chapterNo:c.no,idx:i}))));
const TOPIC=Object.fromEntries(TOPICS.map(t=>[t.id,t]));
const CHAP=Object.fromEntries(CHAPTERS.map(c=>[c.id,c]));
const QID={},QBY={};
QUESTION_BANK.forEach(q=>{QID[q.id]=q;(QBY[q.topicId+"|"+q.level]=QBY[q.topicId+"|"+q.level]||[]).push(q);});
const ROOMS=CHAPTERS.map(c=>({id:c.id,name:"ห้องสอบบทที่ "+c.no,sub:c.name,topics:c.topics.map(t=>t.id)}))
  .concat([{id:"ALL",name:"ห้องสอบรวมทั้งเล่ม",sub:BOOK.name+" (บทที่ 1–4)",topics:TOPICS.map(t=>t.id)}]);
const ROOM=Object.fromEntries(ROOMS.map(r=>[r.id,r]));
/* กฎของโรงเรียน (ปรับได้ที่นี่) */
const RULES={upNeed:4,upWindow:5,downWrong:2,round:5,unlockTopicN:5,roomUnlock:70,testN:20,testMin:45,maxAttempts:5,pass:70,goal:10,mix:[4,6,6,4],noRepeat:6};
const DAY=864e5, STORE_KEY="kruomExamGym_W21102_v1";
const STUDENTS=[];
CURRICULUM.classes.forEach(c=>{const g=c.id.split("/")[0];for(let i=1;i<=c.n;i++){const p=String(i).padStart(2,"0");
  STUDENTS.push({id:c.code+"-"+p,name:"นักเรียนตัวอย่าง "+g+"-"+p,cls:c.id,code:c.code});}});
const STU=Object.fromEntries(STUDENTS.map(s=>[s.id,s]));

/* ===== ตัวช่วย ===== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function gauss(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const dkey=ts=>{const d=new Date(ts);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();};
const fmtDate=ts=>new Date(ts).toLocaleString("th-TH",{day:"numeric",month:"short",year:"2-digit",hour:"2-digit",minute:"2-digit"});

/* ===== โปรไฟล์ผู้เรียน และกลไกปรับระดับ (adaptive engine) ===== */
function newProfile(){return{log:[],ts:{},seen:{},recent:[],tests:{},active:null,lastTopic:null};}
function tstate(P,tid){return P.ts[tid]||(P.ts[tid]={level:0,recent:[],wrong:0});}
/* เลือกโจทย์: ระดับปัจจุบันของหัวข้อ ไม่ซ้ำข้อที่เพิ่งทำ เน้นข้อที่ยังไม่เคยทำ > ข้อที่เคยผิด > ข้อที่ทำนานที่สุด */
function pickQ(P,tid,rnd){
  rnd=rnd||Math.random;const lv=tstate(P,tid).level;const pool=QBY[tid+"|"+lv]||[];
  const recent=new Set(P.recent.slice(-RULES.noRepeat));
  let cand=pool.filter(q=>!recent.has(q.id));
  if(!cand.length){const last=P.recent[P.recent.length-1];cand=pool.filter(q=>q.id!==last);if(!cand.length)cand=pool.slice();}
  const score=q=>{const s=P.seen[q.id];if(!s)return 0;if(!s.c)return 1;return 2+s.t/1e13;};
  let best=Infinity;cand.forEach(q=>best=Math.min(best,score(q)));
  const top=cand.filter(q=>Math.floor(score(q))===Math.floor(best));
  if(best>=2){top.sort((a,b)=>P.seen[a.id].t-P.seen[b.id].t);return top[0];}
  return top[Math.floor(rnd()*top.length)];
}
/* บันทึกคำตอบ แล้วใช้กฎ: ถูก 4 ใน 5 ข้อล่าสุดของระดับนั้น -> ขึ้นระดับ, ผิด 2 ข้อติดกัน -> ลงระดับ */
function applyAnswer(P,q,correct,unsure,ts,extra){
  const st=tstate(P,q.topicId),from=st.level;
  const e={q:q.id,t:q.topicId,lv:q.level,c:correct?1:0,u:unsure?1:0,ts:ts};
  if(extra&&extra.choice!=null)e.a=extra.choice;if(extra&&extra.sim)e.sim=1;
  P.log.push(e);P.seen[q.id]={t:ts,c:e.c};P.recent.push(q.id);if(P.recent.length>12)P.recent.shift();P.lastTopic=q.topicId;
  let change=0;
  if(q.level===st.level){st.recent.push(e.c);if(st.recent.length>RULES.upWindow)st.recent.shift();}
  if(correct){st.wrong=0;const ok=st.recent.reduce((a,b)=>a+b,0);
    if(ok>=RULES.upNeed&&st.level<3){st.level++;st.recent=[];change=1;}}
  else{st.wrong++;if(st.wrong>=RULES.downWrong){if(st.level>0){st.level--;change=-1;st.recent=[];}st.wrong=0;}}
  return{change,from,to:st.level};
}
/* ความแม่น: ถ่วงน้ำหนักข้อใหม่มากกว่า (0.9^ลำดับความเก่า) × ความเพียงพอของจำนวนข้อ min(1,n/5) */
function statsAll(P,opt){
  opt=opt||{};let log=P.log;
  if(opt.before)log=log.filter(e=>e.ts<opt.before);
  if(opt.dropLast)log=log.slice(0,Math.max(0,log.length-opt.dropLast));
  const S={};TOPICS.forEach(t=>S[t.id]={n:0,c:0,w:0,wc:0,u:0,lv:[[0,0],[0,0],[0,0],[0,0]],k:0});
  for(let i=log.length-1;i>=0;i--){const e=log[i],s=S[e.t];if(!s)continue;const w=Math.pow(0.9,s.k++);
    s.n++;s.c+=e.c;s.w+=w;s.wc+=w*e.c;s.u+=e.u||0;s.lv[e.lv][1]++;s.lv[e.lv][0]+=e.c;}
  TOPICS.forEach(t=>{const s=S[t.id];s.acc=s.w?s.wc/s.w:0;s.m=Math.round(s.acc*Math.min(1,s.n/5)*100);});
  return S;
}
function groupM(S,tids){let m=0,n=0,c=0,u=0;const lv=[[0,0],[0,0],[0,0],[0,0]];
  tids.forEach(t=>{const s=S[t];m+=s.m;n+=s.n;c+=s.c;u+=s.u;s.lv.forEach((x,i)=>{lv[i][0]+=x[0];lv[i][1]+=x[1];});});
  return{m:Math.round(m/tids.length),n,c,u,lv};}
const chapTids=cid=>CHAP[cid].topics.map(t=>t.id);
const allTids=()=>TOPICS.map(t=>t.id);
function scopeTids(kind,id){return kind==="topic"?[id]:kind==="chapter"?chapTids(id):kind==="room"?ROOM[id].topics:allTids();}
/* แนวโน้ม: ความแม่นตอนนี้ − ความแม่นเมื่อ 7 วันก่อน (ถ้าไม่มีข้อมูลเก่า เทียบกับก่อน 5 ข้อล่าสุด) */
function trendOf(P,tids,now){
  now=now||Date.now();const cur=groupM(statsAll(P),tids).m;
  const old=P.log.filter(e=>e.ts<now-7*DAY&&tids.includes(e.t)).length;
  const base=old?statsAll(P,{before:now-7*DAY}):statsAll(P,{dropLast:5});
  return cur-groupM(base,tids).m;
}
function band(m,n){if(!n)return{k:0,t:"ยังไม่เริ่ม"};if(m<50)return{k:1,t:"ต้องฝึกเพิ่ม"};if(m<75)return{k:2,t:"กำลังพัฒนา"};return{k:3,t:"แม่นแล้ว"};}
function stars(s){return(s.m>=50?1:0)+(s.m>=75?1:0)+(s.m>=90&&s.n>=10?1:0);}
function topicOpen(S,tid){const t=TOPIC[tid];if(t.idx===0)return true;const prev=CHAP[t.chapterId].topics[t.idx-1].id;return S[prev].n>=RULES.unlockTopicN;}
function weakestTopic(S,tids){let best=null;tids.forEach(t=>{if(!topicOpen(S,t))return;if(!best||S[t].m<S[best].m)best=t;});return best||tids[0];}
function attemptsUsed(P,rid){return(P.tests[rid]||[]).length+(P.active&&P.active.room===rid?1:0);}
function streakInfo(P){
  const days=new Set(P.log.filter(e=>!e.sim).map(e=>dkey(e.ts)));const today=dkey(Date.now());
  let n=0,d=Date.now();if(!days.has(today))d-=DAY;while(days.has(dkey(d))){n++;d-=DAY;}
  const todayN=P.log.filter(e=>dkey(e.ts)===today).length;return{streak:n,today:todayN};}

/* ===== นักเรียนจำลอง (สุ่มแบบกำหนด seed ใช้กลไกเดียวกับของจริง) ===== */
const TDIFF={"1.1":-.3,"1.2":.25,"1.3":0,"1.4":.2,"2.1":-.2,"2.2":0,"2.3":.45,"3.1":-.1,"3.2":.05,"3.3":.2,"3.4":.4,"3.5":0,"3.6":.1,"4.1":0,"4.2":-.15};
const SIM={};
function simulate(stu){
  const r=mulberry32(hashStr("piyamit-"+stu.id));const off={M1:0,M2:.3,M3:.5}[stu.code]||0;
  const ab=off+gauss(r)*.85;const P=newProfile();const now=Date.now();
  const plan=[];const chP=[[1,10,26],[.95,8,22],[.75+.12*ab,3,16],[.45+.15*ab,0,12]];
  CHAPTERS.forEach((c,ci)=>{if(r()>chP[ci][0])return;let stop=false;
    c.topics.forEach(t=>{if(stop)return;let k=Math.round(chP[ci][1]+r()*(chP[ci][2]-chP[ci][1])+ab*3);k=clamp(k,0,30);
      if(ci>=2&&r()<.12)k=Math.min(k,3);for(let i=0;i<k;i++)plan.push(t.id);if(k<RULES.unlockTopicN)stop=true;});});
  const start=now-27*DAY,span=26*DAY;
  plan.forEach((tid,i)=>{const q=pickQ(P,tid,r);const prog=i/Math.max(1,plan.length);
    const p=1/(1+Math.exp(-(1.25*ab+.4*prog+1.6-.8*q.level-(TDIFF[tid]||0))));const c=r()<p;
    const ts=Math.round(start+span*prog+r()*DAY*.3);applyAnswer(P,q,c,r()<(c?.07:.28),ts);});
  const S=statsAll(P);
  ROOMS.forEach(room=>{const m=groupM(S,room.topics).m;if(m<RULES.roomUnlock)return;const k=1+Math.floor(r()*3);P.tests[room.id]=[];
    for(let i=0;i<k;i++){const pct=clamp(Math.round(m-12+i*4+gauss(r)*9),20,100);const correct=Math.round(pct/100*RULES.testN);
      P.tests[room.id].push({ts:now-(k-i)*2*DAY-Math.round(r()*DAY),n:RULES.testN,correct,pct:Math.round(correct/RULES.testN*100),pass:correct/RULES.testN*100>=RULES.pass,sim:1});}});
  return P;
}

function buildTest(rid){const r=ROOM[rid];const used=new Set(),out=[];let ti=Math.floor(Math.random()*r.topics.length);

  for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out.map(q=>q.id);}

function confirmTest(rid){const P=me();P.active={room:rid,qids:buildTest(rid),ans:{},start:Date.now(),cur:0};saveDB();go("test");}
function remaining(P){return Math.max(0,Math.round(RULES.testMin*60-(Date.now()-P.active.start)/1000));}
function fmtT(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
function scrTest(){const P=me(),A=P.active;if(!A)return scrRooms();const q=QID[A.qids[A.cur]];const keys=["ก","ข","ค","ง"];const rem=remaining(P);const done=Object.keys(A.ans).length;
  return`<div class="qhead"><div class="grow"><b>${esc(ROOM[A.room].name)}</b><div class="small mut">ตอบแล้ว ${done} / ${A.qids.length}</div></div><span class="timer ${rem<300?"warn":""}" id="timer">⏱ ${fmtT(rem)}</span></div>
  <div class="card" style="padding:12px"><div class="qnav">${A.qids.map((id,i)=>`<button class="${i===A.cur?"cur":A.ans[id]!=null?"a":""}" data-tq="${i}">${i+1}</button>`).join("")}</div></div>
  <div class="qcard"><div class="row wrapx"><b>ข้อ ${A.cur+1}</b>${lvPill(q.level)}<span class="small mut">${esc(q.topic)}</span></div><div class="qtext">${esc(q.question)}</div></div>
  ${q.choices.map((c,i)=>`<button class="choice ${A.ans[q.id]===i?"sel":""}" data-tans="${i}"><span class="k">${keys[i]}</span><span>${esc(c)}</span></button>`).join("")}
  <div class="actionbar"><div class="in"><button class="btn ghost" data-act="tprev" ${A.cur===0?"disabled":""}>‹ ก่อนหน้า</button>
  ${A.cur<A.qids.length-1?`<button class="btn grow" data-act="tnext">ข้อถัดไป ›</button>`:`<button class="btn green grow" data-act="tsubmit">ส่งคำตอบ</button>`}</div></div>
  <div class="row" style="justify-content:center"><button class="btn light sm" data-act="tsubmit">ส่งคำตอบทั้งหมด</button></div>`;}
function tick(){if(UI.screen!=="test"){return;}const P=me();if(!P||!P.active)return;const rem=remaining(P);const el=document.getElementById("timer");
  if(el){el.textContent="⏱ "+fmtT(rem);el.className="timer"+(rem<300?" warn":"");}if(rem<=0)submitTest(true);}
function submitTest(auto){const P=me(),A=P.active;if(!A)return;let correct=0;const per={};
  A.qids.forEach(id=>{const q=QID[id];const c=A.ans[id]===q.answer?1:0;correct+=c;const k=q.chapterId;per[k]=per[k]||[0,0];per[k][0]+=c;per[k][1]++;});
  const pct=Math.round(correct/A.qids.length*100);const rec={ts:Date.now(),n:A.qids.length,correct,pct,pass:pct>=RULES.pass,auto:!!auto,per,qids:A.qids,ans:A.ans,used:Math.round((Date.now()-A.start)/1000)};
  (P.tests[A.room]=P.tests[A.room]||[]).push(rec);const rid=A.room;P.active=null;saveDB();go("result",{r:rid,i:P.tests[rid].length-1});if(auto)toast("หมดเวลา ระบบส่งคำตอบให้อัตโนมัติ");}
function scrResult(){const P=me(),rid=UI.p.r,H=P.tests[rid]||[],rec=H[UI.p.i];if(!rec)return scrRooms();const keys=["ก","ข","ค","ง"];
  return`${header("ผลสอบ","rooms")}<div class="card" style="text-align:center"><div class="small mut">${esc(ROOM[rid].name)} · ครั้งที่ ${UI.p.i+1}</div>${egg(80,rec.pass?3:1)}
  <div class="big" style="color:${rec.pass?"#178a49":"#d93036"}">${rec.pct}%</div><div style="margin:6px 0">ถูก ${rec.correct}/${rec.n} ข้อ${rec.used?" · ใช้เวลา "+fmtT(rec.used):""}</div>
  <span class="badge ${rec.pass?"pass":"fail"}">${rec.pass?"ผ่าน ✓":"ยังไม่ผ่าน"}</span> <span class="small mut">(เกณฑ์ ${RULES.pass}%)</span>
  ${rec.auto?`<div class="note">ส่งอัตโนมัติเมื่อหมดเวลา</div>`:""}<div class="small mut" style="margin-top:8px">เหลือสิทธิ์สอบ ${RULES.maxAttempts-attemptsUsed(P,rid)} ครั้ง</div></div>
  ${rec.per?`<div class="card"><h3>รายบท</h3>${Object.keys(rec.per).map(k=>`<div class="hbar"><span class="lab">บทที่ ${CHAP[k].no} ${esc(CHAP[k].name)}</span>${bar(rec.per[k][0]/rec.per[k][1]*100)}<b class="small">${rec.per[k][0]}/${rec.per[k][1]}</b></div>`).join("")}</div>`:""}
  ${histHtml(H)}
  ${rec.qids?`<div class="card"><details><summary>ดูเฉลยข้อสอบครั้งนี้</summary>${rec.qids.map((id,i)=>{const q=QID[id],a=rec.ans[id];return`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>${i+1}.</b> ${esc(q.question)}<div class="small">${a!=null?"ตอบ "+keys[a]+" ":"ไม่ได้ตอบ "}${a===q.answer?"✅":"❌ ที่ถูก: "+keys[q.answer]+". "+esc(q.choices[q.answer])}</div></div>`;}).join("")}</details></div>`:""}
  <button class="btn block" data-go="rooms">กลับห้องสอบ</button>`;}
function histHtml(H){return`<div class="card"><h3>ประวัติ</h3><table><tr><th>ครั้ง</th><th>วันที่</th><th>คะแนน</th><th>ผล</th></tr>${H.map((h,i)=>`<tr><td>${i+1}</td><td class="small">${fmtDate(h.ts)}</td><td><b>${h.pct}%</b> <span class="small mut">(${h.correct}/${h.n})</span></td><td><span class="pill ${h.pass?"b3":"b1"}">${h.pass?"ผ่าน":"ไม่ผ่าน"}</span></td></tr>`).join("")}</table></div>`;}

/* ===== หน้าจอ 8: แดชบอร์ดครู ===== */
function hcol(m,n){if(!n)return"background:#eef1f4;color:#7b8794";if(m<50)return"background:#ffe1e1;color:#c22a2f";if(m<75)return"background:#fff1cc;color:#9a6a00";return"background:#d9f5e4;color:#16804a";}
function calcStu(s){const P=getP(s.id),S=statsAll(P),g=groupM(S,allTids());const ch={};CHAPTERS.forEach(c=>ch[c.id]=groupM(S,chapTids(c.id)));
  let tp=0,ta=0;Object.values(P.tests).forEach(H=>{ta+=H.length;tp+=H.some(h=>h.pass)?1:0;});
  const unlocked=ROOMS.filter(r=>groupM(S,r.topics).m>=RULES.roomUnlock).length;const last=P.log.length?P.log[P.log.length-1].ts:0;
  const stT=TOPICS.filter(t=>S[t.id].n);const sm=stT.length?avg(stT.map(t=>S[t.id].m)):0;
  return{s,P,S,g,sm,ch,tr:trendOf(P,allTids()),tp,ta,unlocked,last,live:isLive(s.id),b:band(g.m,g.n)};}
function calcAll(){return STUDENTS.map(calcStu);}
function avg(a){return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;}
function scrTeacher(){const tab=UI.p.tab||"overview",cls=UI.p.cls||"ม.1/1";const ALL=calcAll();const C=ALL.filter(x=>x.s.cls===cls);
  const tabs=[["overview","ภาพรวม"],["heat","ตารางความแม่น"],["compare","เทียบห้อง"],["students","รายชื่อนักเรียน"],["groups","กลุ่มแนะนำ"],["tools","เครื่องมือครู"]];
  let body="";
  if(tab==="overview")body=tOverview(C,cls);else if(tab==="heat")body=tHeat(ALL,C,cls);else if(tab==="compare")body=tCompare(ALL);else if(tab==="students")body=tStudents(C,cls);else if(tab==="groups")body=tGroups(C,cls);else body=tTools();
  return`${header("แดชบอร์ดครู · "+esc(SUBJ.code)+" "+esc(SUBJ.name),"select",`<button class="btn light sm" data-act="help">กฎ</button>`)}
  <div class="small mut" style="margin:-8px 0 10px">${esc(CURRICULUM.school)} · ${esc(BOOK.name)} · ภาคเรียนที่ ${esc(SUBJ.term)} · โหมดครูในต้นแบบไม่มีรหัสผ่าน</div>
  <div class="row wrapx" style="margin-bottom:10px"><span class="small mut">ห้อง:</span>${CURRICULUM.classes.map(c=>`<button class="chip ${c.id===cls?"on":""}" data-tcls="${c.id}">${c.id}</button>`).join("")}</div>
  <div class="tabs">${tabs.map(t=>`<button class="${t[0]===tab?"on":""}" data-tab="${t[0]}">${t[1]}</button>`).join("")}</div>
  ${CURRICULUM.classes.find(c=>c.id===cls).main?"":`<div class="note">ห้อง ${cls} เป็นตัวอย่างโครงสร้าง (ใช้รายวิชาเดียวกันเพื่อสาธิตการเทียบห้อง)</div>`}${body}${footer()}`;}
function tOverview(C,cls){const n=C.length,ms=C.map(x=>x.g.m);const ans=C.reduce((a,x)=>a+x.g.n,0);const act=C.filter(x=>x.last>Date.now()-7*DAY).length;
  const chs=CHAPTERS.map(c=>({c,m:avg(C.map(x=>x.ch[c.id].m))})).sort((a,b)=>a.m-b.m);
  const lvCnt=[0,0,0,0];C.forEach(x=>TOPICS.forEach(t=>{if(x.S[t.id].n)lvCnt[tstate(x.P,t.id).level]++;}));const lvTot=lvCnt.reduce((a,b)=>a+b,0)||1;
  const lvAcc=[0,1,2,3].map(i=>{let c=0,nn=0;C.forEach(x=>{TOPICS.forEach(t=>{c+=x.S[t.id].lv[i][0];nn+=x.S[t.id].lv[i][1];});});return[c,nn];});
  const bands=[0,0,0,0];C.forEach(x=>bands[x.b.k]++);
  return`<div class="kpis"><div class="kpi">นักเรียน<b>${n} คน</b><span class="small mut">ห้อง ${cls}</span></div><div class="kpi">ความแม่นเฉลี่ยทั้งวิชา<b>${avg(ms)}%</b></div>
  <div class="kpi">ข้อที่ฝึกแล้ว<b>${ans.toLocaleString("th-TH")}</b></div><div class="kpi">ฝึกใน 7 วันล่าสุด<b>${act} คน</b></div>
  <div class="kpi">ปลดล็อกห้องสอบ ≥1 ห้อง<b>${C.filter(x=>x.unlocked).length} คน</b></div><div class="kpi">สอบผ่าน ≥1 ห้อง<b>${C.filter(x=>x.tp).length} คน</b></div></div>
  <div class="dgrid"><div class="card"><h2>บทที่ควรเน้น (อ่อนสุดก่อน)</h2>${chs.map(o=>`<div class="hbar"><span class="lab">บทที่ ${o.c.no} ${esc(o.c.name)}</span>${bar(o.m)}<b class="small" style="width:44px;text-align:right">${o.m}%</b></div>`).join("")}
   <h3 style="margin-top:14px">ระดับความแม่นของนักเรียน</h3>${["ยังไม่เริ่ม","ต้องฝึกเพิ่ม","กำลังพัฒนา","แม่นแล้ว"].map((t,i)=>`<div class="hbar"><span class="lab"><span class="pill b${i}">${t}</span></span>${bar(bands[i]/n*100)}<b class="small">${bands[i]}</b></div>`).join("")}</div>
  <div class="card"><h2>การกระจายระดับ</h2><div class="small mut">ระดับปัจจุบันของนักเรียนในหัวข้อที่เริ่มแล้ว (${lvTot} หัวข้อ×คน)</div>${LV.map((l,i)=>`<div class="hbar"><span class="lab">${lvPill(i)}</span>${bar(lvCnt[i]/lvTot*100)}<b class="small">${Math.round(lvCnt[i]/lvTot*100)}%</b></div>`).join("")}
   <h3 style="margin-top:14px">ความถูกต้องตามระดับ</h3><div class="grid4">${lvAcc.map((x,i)=>`<div class="tile"><span class="pill lv${i}">${LV[i]}</span><b>${x[1]?Math.round(x[0]/x[1]*100):0}%</b><span class="tiny mut">${x[0]}/${x[1]}</span></div>`).join("")}</div></div></div>`;}
function tHeat(ALL,C,cls){const classes=CURRICULUM.classes.map(c=>c.id);const by=id=>ALL.filter(x=>x.s.cls===id);
  const cell=(arr,f)=>{const v=arr.map(f);const m=avg(v.map(o=>o.m)),n=v.reduce((a,o)=>a+o.n,0);return`<td class="h" style="${hcol(m,n)}">${n?m+"%":"–"}</td>`;};
  let rows="";CHAPTERS.forEach(c=>{rows+=`<tr style="background:#f5faff"><td><b>บทที่ ${c.no} ${esc(c.name)}</b></td>${classes.map(k=>cell(by(k),x=>x.ch[c.id])).join("")}</tr>`;
    c.topics.forEach(t=>{rows+=`<tr><td class="small" style="padding-left:18px">${t.id} ${esc(t.name)}</td>${classes.map(k=>cell(by(k),x=>({m:x.S[t.id].m,n:x.S[t.id].n}))).join("")}</tr>`;});});
  const stuRows=C.map(x=>`<tr class="trow" data-stu="${x.s.id}"><td class="small">${esc(x.s.name.replace("นักเรียนตัวอย่าง ",""))}${x.live?" ●":""}</td>${TOPICS.map(t=>`<td class="h tiny" style="${hcol(x.S[t.id].m,x.S[t.id].n)}">${x.S[t.id].n?x.S[t.id].m:"·"}</td>`).join("")}</tr>`).join("");
  return`<div class="card scroll"><h2>หัวข้อ/บท × ห้อง (ความแม่นเฉลี่ย)</h2><table class="heat"><tr><th>หัวข้อ</th>${classes.map(k=>`<th style="text-align:center">${k}</th>`).join("")}</tr>${rows}</table>
  <div class="row wrapx small" style="margin-top:8px"><span class="pill b0">ยังไม่เริ่ม</span><span class="pill b1">&lt;50 ต้องฝึกเพิ่ม</span><span class="pill b2">50–74 กำลังพัฒนา</span><span class="pill b3">≥75 แม่นแล้ว</span></div></div>
  <div class="card scroll"><h2>นักเรียน × หัวข้อ (ห้อง ${cls})</h2><div class="small mut">แตะชื่อเพื่อดูรายละเอียด · ● = มีข้อมูลจริงจากเครื่องนี้</div><table class="heat"><tr><th>ชื่อ</th>${TOPICS.map(t=>`<th class="tiny" title="${esc(t.name)}">${t.id}</th>`).join("")}</tr>${stuRows}</table></div>`;}
function tCompare(ALL){const cls=CURRICULUM.classes;
  return`<div class="card"><h2>เทียบห้อง ม.1/1 · ม.2/1 · ม.3/1</h2><div class="note">ม.2/1 และ ม.3/1 เป็นข้อมูลตัวอย่างโครงสร้าง ใช้รายวิชาเดียวกันเพื่อสาธิตเท่านั้น</div><div class="scroll"><table><tr><th>ห้อง</th><th>คน</th><th>ความแม่นเฉลี่ย</th>${CHAPTERS.map(c=>`<th>บท ${c.no}</th>`).join("")}<th>สอบผ่าน ≥1</th><th>ต้องช่วยเหลือ</th></tr>
  ${cls.map(c=>{const A=ALL.filter(x=>x.s.cls===c.id);return`<tr><td><b>${c.id}</b></td><td>${A.length}</td><td><div class="row"><div class="grow" style="min-width:80px">${bar(avg(A.map(x=>x.g.m)))}</div><b>${avg(A.map(x=>x.g.m))}%</b></div></td>${CHAPTERS.map(ch=>{const m=avg(A.map(x=>x.ch[ch.id].m));return`<td><span class="pill" style="${hcol(m,1)}">${m}%</span></td>`;}).join("")}<td>${A.filter(x=>x.tp).length}</td><td>${A.filter(needHelp).length}</td></tr>`;}).join("")}</table></div></div>
  <div class="card"><h3>ความแม่นเฉลี่ยรายบท</h3>${CHAPTERS.map(ch=>`<div style="margin:8px 0"><b class="small">บทที่ ${ch.no} ${esc(ch.name)}</b>${cls.map(c=>{const m=avg(ALL.filter(x=>x.s.cls===c.id).map(x=>x.ch[ch.id].m));return`<div class="hbar"><span class="lab" style="width:60px">${c.id}</span>${bar(m)}<b class="small">${m}%</b></div>`;}).join("")}</div>`).join("")}</div>`;}
function tStudents(C,cls){return`<div class="card"><div class="row wrapx"><h2 class="grow" style="margin:0">รายชื่อนักเรียน ห้อง ${cls}</h2><input id="q" placeholder="ค้นหาชื่อ เช่น 05" value="${esc(UI.p.q||"")}" style="min-height:44px;border-radius:999px;border:2px solid #d6e7f5;padding:0 16px;min-width:200px"></div>
  <div class="scroll" style="margin-top:10px"><table><thead><tr>${[["name","ชื่อ"],["m","ความแม่น"],["band","ระดับ"],["n","ข้อที่ฝึก"],["tr","แนวโน้ม"],["tp","สอบผ่าน"],["last","ฝึกล่าสุด"]].map(h=>`<th class="s" data-sort="${h[0]}">${h[1]}${(UI.p.sort||"name")===h[0]?(UI.p.dir>0?" ▲":" ▼"):""}</th>`).join("")}</tr></thead><tbody id="tb">${stuRowsHtml(C)}</tbody></table></div></div>`;}
function stuRowsHtml(C){const q=(UI.p.q||"").trim();const k=UI.p.sort||"name",d=UI.p.dir||1;
  const val=x=>k==="name"?x.s.id:k==="m"?x.g.m:k==="band"?x.b.k:k==="n"?x.g.n:k==="tr"?x.tr:k==="tp"?x.tp:x.last;
  return C.filter(x=>!q||x.s.name.includes(q)||x.s.id.includes(q)).sort((a,b)=>(val(a)>val(b)?1:val(a)<val(b)?-1:0)*d).map(x=>`<tr class="trow" data-stu="${x.s.id}"><td>${esc(x.s.name)}${x.live?' <span class="pill lv0">เครื่องนี้</span>':""}</td><td><b>${x.g.m}%</b></td><td>${bandPill(x.b)}</td><td>${x.g.n}</td><td style="color:${x.tr>=0?"#178a49":"#d93036"}">${x.tr>=0?"+":""}${x.tr}%</td><td>${x.tp}/${ROOMS.length}</td><td class="small mut">${x.last?fmtDate(x.last):"–"}</td></tr>`).join("")||`<tr><td colspan="7" class="mut">ไม่พบ</td></tr>`;}
function needHelp(x){const weak=TOPICS.filter(t=>x.S[t.id].n>=3&&x.S[t.id].m<50).length;return(x.g.n>=10&&x.sm<50)||weak>=3;}
function highPot(x){let c=0,n=0;TOPICS.forEach(t=>{c+=x.S[t.id].lv[3][0];n+=x.S[t.id].lv[3][1];});return x.sm>=75&&n>=5&&c/n>=.6;}
function tGroups(C,cls){const H=C.filter(needHelp),G=C.filter(highPot);const li=(x,why)=>`<tr class="trow" data-stu="${x.s.id}"><td>${esc(x.s.name)}</td><td><b>${x.g.m}%</b> / ${x.sm}%</td><td class="small">${why(x)}</td></tr>`;
  const weakT=x=>TOPICS.filter(t=>x.S[t.id].n).sort((a,b)=>x.S[a.id].m-x.S[b.id].m).slice(0,2).map(t=>t.id).join(", ");
  return`<div class="note">เป็น <b>ข้อเสนอแนะสำหรับครู</b> จากข้อมูลการฝึก ไม่ใช่การวินิจฉัยหรือการตัดสินนักเรียน ครูควรพิจารณาร่วมกับข้อมูลอื่น</div>
  <div class="dgrid"><div class="card"><h2>กลุ่มที่ควรช่วยเหลือ (${H.length})</h2><div class="small mut">ความแม่นเฉลี่ยของหัวข้อที่ฝึกแล้ว &lt;50% หรือมีหัวข้อที่ฝึกแล้วแต่ &lt;50% ตั้งแต่ 3 หัวข้อ</div><table><tr><th>ชื่อ</th><th>แม่น (ทั้งวิชา / หัวข้อที่ฝึก)</th><th>หัวข้อที่อ่อน</th></tr>${H.map(x=>li(x,weakT)).join("")||'<tr><td class="mut">ไม่มี</td></tr>'}</table></div>
  <div class="card"><h2>กลุ่มศักยภาพสูง (${G.length})</h2><div class="small mut">ความแม่นเฉลี่ยของหัวข้อที่ฝึกแล้ว ≥75% และตอบระดับยากถูก ≥60% (อย่างน้อย 5 ข้อ)</div><table><tr><th>ชื่อ</th><th>แม่น (ทั้งวิชา / หัวข้อที่ฝึก)</th><th>ข้อเสนอ</th></tr>${G.map(x=>li(x,()=>"ลองห้องสอบ/โจทย์ระดับยากเพิ่ม")).join("")||'<tr><td class="mut">ไม่มี</td></tr>'}</table></div></div>`;}
function spark(P){const now=Date.now();const pts=[3,2,1,0].map(w=>groupM(statsAll(P,{before:now-w*7*DAY+1}),allTids()).m);
  const xs=pts.map((v,i)=>`${10+i*60},${70-v*.6}`).join(" ");
  return`<svg viewBox="0 0 200 80" width="200" height="80"><polyline points="${xs}" fill="none" stroke="#3189D0" stroke-width="3"/>${pts.map((v,i)=>`<circle cx="${10+i*60}" cy="${70-v*.6}" r="4" fill="#3189D0"/><text x="${10+i*60}" y="${62-v*.6}" font-size="11" text-anchor="middle" fill="#1465A5">${v}</text>`).join("")}</svg><div class="tiny mut">ความแม่นทั้งวิชา 4 สัปดาห์ (3 สัปดาห์ก่อน → ตอนนี้)</div>`;}
function showStudent(id){const x=calcStu(STU[id]);const st=TOPICS.filter(t=>x.S[t.id].n>=5).sort((a,b)=>x.S[b.id].m-x.S[a.id].m);
  const strong=st.filter(t=>x.S[t.id].m>=75).slice(0,3),weak=TOPICS.filter(t=>x.S[t.id].n&&x.S[t.id].m<75&&!strong.includes(t)).sort((a,b)=>x.S[a.id].m-x.S[b.id].m).slice(0,3);
  const rec=[];TOPICS.filter(t=>x.S[t.id].n&&x.S[t.id].m<75).sort((a,b)=>x.S[a.id].m-x.S[b.id].m).forEach(t=>{if(rec.length<3)rec.push(t);});
  TOPICS.forEach(t=>{if(rec.length<3&&!x.S[t.id].n&&topicOpen(x.S,t.id))rec.push(t);});TOPICS.forEach(t=>{if(rec.length<3&&!rec.includes(t)&&x.S[t.id].m<90)rec.push(t);});
  sheet(`<div class="row"><div class="grow"><h2 style="margin:0">${esc(x.s.name)}</h2><div class="small mut">ห้อง ${x.s.cls} · ${x.live?"ข้อมูลจากการใช้งานในเครื่องนี้":"ข้อมูลตัวอย่างจำลอง"}</div></div>${egg(56,x.b.k)}<button class="iconbtn" data-close="1">✕</button></div>
  <div class="grid2" style="margin-top:10px"><div class="tile">ความแม่นทั้งวิชา<b>${x.g.m}%</b>${bandPill(x.b)}</div><div class="tile">ข้อที่ฝึก<b>${x.g.n}</b><span class="small">ถูก ${x.g.c} · แนวโน้ม ${x.tr>=0?"+":""}${x.tr}%</span></div></div>
  <h3 style="margin-top:12px">ความแม่นรายบท</h3>${CHAPTERS.map(c=>`<div class="hbar"><span class="lab">บทที่ ${c.no} ${esc(c.name)}</span>${bar(x.ch[c.id].m)}<b class="small">${x.ch[c.id].m}%</b></div>`).join("")}
  <h3 style="margin-top:12px">ความถูกต้องตามระดับ</h3><div class="grid4">${x.g.lv.map((v,i)=>`<div class="tile"><span class="pill lv${i}">${LV[i]}</span><b>${v[1]?Math.round(v[0]/v[1]*100)+"%":"–"}</b><span class="tiny">${v[0]}/${v[1]}</span></div>`).join("")}</div>
  <div class="grid2" style="margin-top:12px"><div><h3>จุดแข็ง</h3>${strong.map(t=>`<div class="small">✅ ${t.id} ${esc(t.name)} (${x.S[t.id].m}%)</div>`).join("")||'<div class="small mut">ยังไม่มีหัวข้อที่ถึง 75% (ฝึกอย่างน้อย 5 ข้อ)</div>'}</div>
  <div><h3>จุดที่ควรพัฒนา</h3>${weak.map(t=>`<div class="small">⚠️ ${t.id} ${esc(t.name)} (${x.S[t.id].m}%)</div>`).join("")||'<div class="small mut">ยังไม่พบหัวข้อที่ต่ำกว่า 75% ในหัวข้อที่ฝึกแล้ว</div>'}</div></div>
  <h3 style="margin-top:12px">แนะนำ 3 หัวข้อ</h3><ol style="margin:0;padding-left:22px">${rec.slice(0,3).map(t=>`<li>${t.id} ${esc(t.name)} ${x.S[t.id].n?"("+x.S[t.id].m+"%)":"(ยังไม่เริ่ม)"}</li>`).join("")}</ol>
  <h3 style="margin-top:12px">การสอบจำลอง</h3>${ROOMS.map(r=>{const H=x.P.tests[r.id]||[];return`<div class="small">${esc(r.name)}: ${H.length?H.map(h=>`<span class="pill ${h.pass?"b3":"b1"}">${h.pct}%</span>`).join(" "):'<span class="mut">ยังไม่สอบ</span>'} <span class="mut">(${H.length}/${RULES.maxAttempts})</span></div>`;}).join("")}
  <h3 style="margin-top:12px">แนวโน้ม</h3>${spark(x.P)}<div class="note">ข้อมูลนี้ใช้ประกอบการช่วยเหลือ ไม่ใช่การวินิจฉัย</div>`,{mid:true});}
function tTools(){const opts=STUDENTS.filter(s=>s.cls==="ม.1/1").map(s=>`<option value="${s.id}" ${s.id===(DB.current||"M1-01")?"selected":""}>${esc(s.name)}</option>`).join("");
  return`<div class="dgrid"><div class="card"><h2>จำลองความแม่น… (สำหรับสาธิตการปลดล็อกห้องสอบ)</h2><div class="small mut">เพิ่มคำตอบจำลองที่ส่วนใหญ่ถูก (8 ข้อต่อหัวข้อ) ให้นักเรียนที่เลือก เพื่อให้ความแม่นของห้องนั้นเกิน 70% · คำตอบจำลองถูกติดป้าย sim</div>
   <div class="row wrapx" style="margin-top:10px"><select id="seedStu" style="min-height:44px;border-radius:12px;padding:0 10px">${opts}</select><select id="seedRoom" style="min-height:44px;border-radius:12px;padding:0 10px">${ROOMS.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join("")}</select>
   <button class="btn sm" data-act="seed">จำลองความแม่น</button></div></div>
  <div class="card"><h2>ข้อมูลและไฟล์</h2><div class="row wrapx"><button class="btn ghost sm" data-act="dlBank">ดาวน์โหลดคลังโจทย์ (JSON)</button><button class="btn ghost sm" data-act="dlData">ส่งออกความคืบหน้า (JSON)</button><button class="btn light sm" data-act="source">แหล่งที่มาของหัวข้อ</button></div>
   <div class="small" style="margin-top:10px">คลังโจทย์: ${QUESTION_BANK.length} ข้อ · ${TOPICS.length} หัวข้อ × 4 ระดับ</div></div></div>
  <div class="card"><h2>วิธีเพิ่มโจทย์และนักเรียนจริง</h2><details open><summary>รูปแบบโจทย์ (QUESTION_BANK)</summary><pre>${esc(JSON.stringify(QUESTION_BANK[0],null,1))}</pre>
  <ul class="small"><li>answer = ลำดับของตัวเลือกที่ถูก (0=ก, 1=ข, 2=ค, 3=ง)</li><li>level: 0 ตั้งไข่ · 1 ง่าย · 2 กลาง · 3 ยาก</li><li>topicId ต้องตรงกับหัวข้อใน CURRICULUM เช่น "2.3"</li><li>วิธีง่ายที่สุด: แก้ไฟล์ app_src/bank_*.py (ตัวเลือกที่ถูกใส่ไว้ตัวแรก) แล้วรัน python3 build.py ระบบจะสลับตำแหน่งตัวเลือกและสร้างไฟล์ HTML ใหม่</li></ul></details>
  <details><summary>เพิ่ม/แก้รายชื่อนักเรียน</summary><div class="small">แก้ CURRICULUM.classes (id, code, n) ในไฟล์ build.py ระบบสร้างรหัส เช่น M1-01 และชื่อตัวอย่างให้อัตโนมัติ ถ้าใช้จริงควรเปลี่ยนเป็นรหัสนักเรียนแบบไม่ระบุตัวตน และต้องมีระบบบัญชี/เซิร์ฟเวอร์ที่โรงเรียนอนุมัติ ไม่ควรใส่ชื่อจริง เบอร์โทร หรือเลขประจำตัวลงในไฟล์นี้</div></details></div>`;}
function seedMastery(id,rid){if(!DB.profiles[id])DB.profiles[id]=newProfile();const P=DB.profiles[id];const pat=[1,1,1,1,0,1,1,1];let ts=Date.now()-3*3600e3;
  ROOM[rid].topics.forEach(tid=>{pat.forEach(c=>{const q=pickQ(P,tid);applyAnswer(P,q,!!c,false,ts,{choice:c?q.answer:(q.answer+1)%4,sim:1});ts+=20e3;});});saveDB();
  return groupM(statsAll(P),ROOM[rid].topics).m;}
function download(name,obj){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,1)],{type:"application/json"}));a.download=name;a.click();}

/* ===== ตัวจัดการเหตุการณ์ ===== */
document.addEventListener("click",e=>{const el=e.target.closest("[data-go],[data-act],[data-cls],[data-login],[data-ch],[data-pick],[data-tq],[data-tans],[data-tutor],[data-tab],[data-tcls],[data-stu],[data-sort]");if(!el||el.disabled)return;const d=el.dataset;
  if(d.go){if(d.go.startsWith("ch:"))return go("chapter",{ch:d.go.slice(3)});if(d.go==="teacher")return go("teacher",{tab:"overview",cls:"ม.1/1"});if(d.go==="select"){DB.current=null;saveDB();}return go(d.go);}
  if(d.cls){DB.cls=d.cls;saveDB();return render();}
  if(d.login){if(!DB.profiles[d.login])DB.profiles[d.login]=newProfile();DB.current=d.login;saveDB();return go("home");}
  if(d.ch&&!d.act)return go("chapter",{ch:d.ch});
  if(d.pick!=null&&QS&&!QS.checked){QS.sel=+d.pick;return render();}
  if(d.tq!=null){me().active.cur=+d.tq;saveDB();return render();}
  if(d.tans!=null){const A=me().active;A.ans[A.qids[A.cur]]=+d.tans;saveDB();return render();}
  if(d.tutor)return showTutor(QS.q,d.tutor);
  if(d.tab){UI.p.tab=d.tab;return render();}
  if(d.tcls){UI.p.cls=d.tcls;return render();}
  if(d.stu)return showStudent(d.stu);
  if(d.sort){if(UI.p.sort===d.sort)UI.p.dir=-(UI.p.dir||1);else{UI.p.sort=d.sort;UI.p.dir=d.sort==="name"?1:-1;}return render();}
  const a=d.act;
  if(a==="reset"){if(confirm("ล้างความคืบหน้าทั้งหมดในเครื่องนี้ และกลับไปใช้ข้อมูลตัวอย่างเริ่มต้น?")){resetDB();QS=null;go("select");toast("รีเซ็ตข้อมูลตัวอย่างแล้ว");}return;}
  if(a==="logout"){DB.current=null;saveDB();return go("select");}
  if(a==="continue"||a==="practice")return startPractice("topic",d.t);
  if(a==="practiceCh")return startPractice("chapter",d.ch);
  if(a==="mastery")return go("mastery",{k:d.k,id:d.id});
  if(a==="help")return showHelp();
  if(a==="source")return showSource();
  if(a==="unsure"){QS.unsure=!QS.unsure;return render();}
  if(a==="hint")return showHint(QS.q);
  if(a==="explain")return showExplain(QS.q);
  if(a==="tutor")return showTutor(QS.q,null);
  if(a==="check")return doCheck();
  if(a==="next"){if(QS.done>=RULES.round)return afterRound();return nextQ();}
  if(a==="quitQuiz"){const t=QS.q.topicId;QS=null;return go("chapter",{ch:TOPIC[t].chapterId});}
  if(a==="again"){const p=UI.p;if(p.k==="topic")return startPractice("topic",p.id);if(p.k==="chapter")return startPractice("chapter",p.id);const S=statsAll(me());return startPractice("topic",weakestTopic(S,allTids()));}
  if(a==="startTest")return startTest(d.r);
  if(a==="confirmTest")return confirmTest(d.r);
  if(a==="resumeTest")return go("test");
  if(a==="tprev"){me().active.cur--;saveDB();return render();}
  if(a==="tnext"){me().active.cur++;saveDB();return render();}
  if(a==="tsubmit"){const A=me().active;const left=A.qids.length-Object.keys(A.ans).length;if(left&&!confirm("ยังไม่ได้ตอบ "+left+" ข้อ ต้องการส่งเลยหรือไม่?"))return;return submitTest(false);}
  if(a==="history"){const P=me();return sheet(`<h2>ประวัติ · ${esc(ROOM[d.r].name)}</h2>${histHtml(P.tests[d.r]||[])}<button class="btn block" data-close="1">ปิด</button>`);}
  if(a==="seed"){const id=document.getElementById("seedStu").value,rid=document.getElementById("seedRoom").value;const m=seedMastery(id,rid);toast("จำลองแล้ว: "+ROOM[rid].name+" = "+m+"%");return render();}
  if(a==="dlBank")return download("question_bank_W21102.json",QUESTION_BANK);
  if(a==="dlData")return download("examgym_progress.json",DB);
});
document.addEventListener("input",e=>{if(e.target.id==="q"){UI.p.q=e.target.value;const C=calcAll().filter(x=>x.s.cls===(UI.p.cls||"ม.1/1"));document.getElementById("tb").innerHTML=stuRowsHtml(C);}});

/* ===== render ===== */
function render(){const s=UI.screen;document.body.classList.toggle("wide",s==="teacher");
  const needMe=["home","subject","book","chapter","quiz","mastery","review","rooms","test","result"];
  if(needMe.includes(s)&&!me()){UI={screen:"select",p:{}};}
  if(s==="quiz"&&!QS){UI={screen:"home",p:{}};}
  const f={select:scrSelect,home:scrHome,subject:scrSubject,book:scrBook,chapter:scrChapter,quiz:scrQuiz,mastery:scrMastery,review:scrReview,rooms:scrRooms,test:scrTest,result:scrResult,teacher:scrTeacher}[UI.screen]||scrSelect;
  $app.innerHTML=f();}
setInterval(tick,1000);
UI={screen:me()?(me().active?"test":"home"):"select",p:{}};render();
/* ตัวช่วยสำหรับการทดสอบอัตโนมัติ */
window.__EG={DB:()=>DB,me,getP,statsAll,groupM,RULES,QUESTION_BANK,go,seedMastery,startPractice,
  fastForward:s=>{const P=me();if(P&&P.active){P.active.start-=s*1000;saveDB();tick();}},cur:()=>QS&&QS.q,ui:()=>UI};

</script>
</body>
